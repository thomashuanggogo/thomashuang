      function bindStepEvents() {
        stepBody.querySelectorAll('[data-pred]').forEach(function (btn) {
          btn.addEventListener('click', function () { state.prediction = btn.getAttribute('data-pred'); renderAll(); });
        });
        stepBody.querySelectorAll('[data-pv]').forEach(function (btn) {
          btn.addEventListener('click', function () { state.predV = btn.getAttribute('data-pv'); renderAll(); });
        });
        stepBody.querySelectorAll('[data-pi]').forEach(function (btn) {
          btn.addEventListener('click', function () { state.predI = btn.getAttribute('data-pi'); renderAll(); });
        });

        var vSl = document.getElementById('vSlider');
        if (vSl) {
          vSl.addEventListener('input', function () {
            state.voltageV = Number(vSl.value);
            var el = document.getElementById('vSliderVal');
            if (el) el.textContent = Math.round(state.voltageV) + ' V';
            renderReadouts();
          });
          vSl.addEventListener('change', renderAll);
        }

        var iSl = document.getElementById('iSlider');
        if (iSl) {
          iSl.addEventListener('input', function () {
            state.currentA = Number(iSl.value);
            var el = document.getElementById('iSliderVal');
            if (el) el.textContent = state.currentA.toFixed(2) + ' A';
            renderReadouts();
          });
          iSl.addEventListener('change', renderAll);
        }

        var recBtn = document.getElementById('recordMeasureBtn');
        if (recBtn) {
          recBtn.addEventListener('click', function () {
            var phys = getPhys();
            if (!phys.isCircular) return;
            var dCm = getMeasuredDiameterCm();
            if (dCm <= 0.5) return;
            var calc = P.calculateEOverM(phys.voltageV, phys.bFieldT, dCm);
            state.records.push({ v: Math.round(phys.voltageV), i: phys.currentA, dCm: dCm, eOverM: calc.eOverM });
            if (state.records.length > 3) state.records.shift();
            renderAll();
          });
        }

        var frontBtn = document.getElementById('frontRulerBtn');
        var backBtn = document.getElementById('backRulerBtn');
        if (frontBtn) frontBtn.addEventListener('click', function () { state.rulerMode = 'front'; renderAll(); });
        if (backBtn) backBtn.addEventListener('click', function () { state.rulerMode = 'back'; renderAll(); });

        var rstBtn = document.getElementById('resetMeasureBtn');
        if (rstBtn) rstBtn.addEventListener('click', function () { state.records = []; renderAll(); });

        var fNext = document.getElementById('formulaNextBtn');
        if (fNext) {
          fNext.addEventListener('click', function () {
            if (state.formulaRevealCount < 4) {
              state.formulaRevealCount += 1;
              state.formulaFocusIdx = state.formulaRevealCount - 1;
              renderAll();
            }
          });
        }
        stepBody.querySelectorAll('[data-term]').forEach(function (btn) {
          btn.addEventListener('click', function () {
            var idx = Number(btn.getAttribute('data-term'));
            if (idx + 1 > state.formulaRevealCount) state.formulaRevealCount = idx + 1;
            state.formulaFocusIdx = idx;
            renderAll();
          });
        });

        stepBody.querySelectorAll('[data-myth]').forEach(function (btn) {
          btn.addEventListener('click', function () { state.mythIndex = Number(btn.getAttribute('data-myth')); renderAll(); });
        });
        stepBody.querySelectorAll('[data-ans]').forEach(function (btn) {
          btn.addEventListener('click', function () { state.transferChoice = btn.getAttribute('data-ans'); renderAll(); });
        });

        // 第 10 步 3D 延伸模組事件
        stepBody.querySelectorAll('[data-p10]').forEach(function (btn) {
          btn.addEventListener('click', function () {
            state.step10Pred = btn.getAttribute('data-p10');
            if (state.deltaDeg === 0) state.deltaDeg = 15;
            renderAll();
          });
        });

        function updateStep10Cards() {
          if (state.step !== 10) return;
          var hPhys = P.computeHelicalState({ voltageV: state.voltageV, currentA: state.currentA, deltaDeg: state.deltaDeg });
          var elR = document.getElementById('s10R');
          var elVp = document.getElementById('s10Vp');
          var elP = document.getElementById('s10P');
          var elT = document.getElementById('s10T');
          if (elR) elR.textContent = hPhys.radiusCm.toFixed(1) + ' cm';
          if (elVp) elVp.textContent = (hPhys.vParallelMs / 1e6).toFixed(2) + ' ×10^6 m/s';
          if (elP) elP.textContent = hPhys.pitchCm.toFixed(1) + ' cm';
          if (elT) elT.textContent = (hPhys.periodS * 1e8).toFixed(2) + ' ×10^-8 s';
        }

        var dSl = document.getElementById('deltaSlider');
        if (dSl) {
          dSl.addEventListener('input', function () {
            state.deltaDeg = Number(dSl.value);
            var el = document.getElementById('deltaSliderVal');
            if (el) el.textContent = state.deltaDeg.toFixed(0) + '°';
            renderReadouts();
            updateStep10Cards();
          });
          dSl.addEventListener('change', renderAll);
        }
        var rvBtn = document.getElementById('resetViewBtn');
        if (rvBtn) rvBtn.addEventListener('click', function () { state.yawDeg = 0; state.pitchDeg = 0; renderReadouts(); });
        var p45Btn = document.getElementById('preset45Btn');
        if (p45Btn) p45Btn.addEventListener('click', function () { state.yawDeg = 45; state.pitchDeg = 12; renderReadouts(); });
      }

      function renderNavButtons() {
        prevBtn.disabled = state.step <= 1;
        if (state.step >= STEPS.length) {
          nextBtn.textContent = '已完成全部步驟';
          nextBtn.disabled = true;
        } else if (state.step === 1 && !state.prediction) {
          nextBtn.textContent = '請先選擇預測';
          nextBtn.disabled = true;
        } else if (state.step === 7 && state.formulaRevealCount < 4) {
          nextBtn.textContent = '請先看完全部 4 個符號';
          nextBtn.disabled = true;
        } else {
          nextBtn.textContent = '下一步';
          nextBtn.disabled = false;
        }
      }

      function renderAll() {
        renderStepStrip();
        renderReadouts();
        renderStepBody();
        renderNavButtons();
      }

      playPauseBtn.addEventListener('click', function () { state.isPlaying = !state.isPlaying; renderReadouts(); });
      stepOrbitBtn.addEventListener('click', function () {
        state.isPlaying = false;
        state.electronPhase = (state.electronPhase + 0.08) % 1;
        renderReadouts();
      });

      document.querySelectorAll('.speed-btn').forEach(function (btn) {
        btn.addEventListener('click', function () {
          state.speedMultiplier = Number(btn.getAttribute('data-speed'));
          document.querySelectorAll('.speed-btn').forEach(function (b) { b.classList.toggle('active', b === btn); });
        });
      });

      prevBtn.addEventListener('click', function () { goToStep(state.step - 1); });
      nextBtn.addEventListener('click', unlockAndNext);

      // 游標拖曳（第 6 步）＋ 3D 視角拖曳（第 10 步）
      var draggingCaliper = null; // 'left' | 'right' | null
      var dragging3D = null;      // { x, y, yaw, pitch } | null
      function getBulbGeom(w, h) {
        var bulbCx = w * 0.52;
        var bulbCy = h * 0.38;
        var bulbR = Math.min(w * 0.23, h * 0.28);
        return { cx: bulbCx, cy: bulbCy, r: bulbR };
      }

      function getRulerGeom(w, h) {
        var bg = getBulbGeom(w, h);
        var rLeft = bg.cx - bg.r * 0.88;
        var rRight = bg.cx + bg.r * 0.88;
        var rY = bg.cy + bg.r + 14;
        return { left: rLeft, right: rRight, width: rRight - rLeft, y: rY, maxCm: 16 };
      }

      canvas.addEventListener('pointerdown', function (ev) {
        if (state.step === 10) {
          dragging3D = { x: ev.clientX, y: ev.clientY, yaw: state.yawDeg, pitch: state.pitchDeg };
          return;
        }
        if (state.step !== 6) return;
        var rect = canvas.getBoundingClientRect();
        var x = ev.clientX - rect.left;
        var rg = getRulerGeom(rect.width, rect.height);
        var xL = rg.left + (state.caliperLeftCm / rg.maxCm) * rg.width;
        var xR = rg.left + (state.caliperRightCm / rg.maxCm) * rg.width;
        if (Math.abs(x - xL) < 24 && Math.abs(x - xL) <= Math.abs(x - xR)) {
          draggingCaliper = 'left';
        } else if (Math.abs(x - xR) < 24) {
          draggingCaliper = 'right';
        }
      });

      window.addEventListener('pointermove', function (ev) {
        if (dragging3D && state.step === 10) {
          var dx = ev.clientX - dragging3D.x;
          var dy = ev.clientY - dragging3D.y;
          state.yawDeg = Math.max(-60, Math.min(60, dragging3D.yaw + dx * 0.35));
          state.pitchDeg = Math.max(-35, Math.min(35, dragging3D.pitch + dy * 0.25));
          statusSummary.textContent = '3D 視角：yaw ' + Math.round(state.yawDeg) + '° / pitch ' + Math.round(state.pitchDeg) + '°';
          return;
        }
        if (!draggingCaliper) return;
        var rect = canvas.getBoundingClientRect();
        var x = ev.clientX - rect.left;
        var rg = getRulerGeom(rect.width, rect.height);
        var cm = ((x - rg.left) / rg.width) * rg.maxCm;
        cm = Math.max(0, Math.min(rg.maxCm, Math.round(cm * 10) / 10));
        if (draggingCaliper === 'left') {
          state.caliperLeftCm = Math.min(cm, state.caliperRightCm - 0.5);
        } else {
          state.caliperRightCm = Math.max(cm, state.caliperLeftCm + 0.5);
        }
        renderStepBody();
      });

      window.addEventListener('pointerup', function () {
        draggingCaliper = null;
        dragging3D = null;
      });

      function drawArrow(x1, y1, x2, y2, color, lw) {
        var head = 8;
        var ang = Math.atan2(y2 - y1, x2 - x1);
        ctx.save();
        ctx.strokeStyle = color;
        ctx.fillStyle = color;
        ctx.lineWidth = lw || 2.2;
        ctx.beginPath();
        ctx.moveTo(x1, y1);
        ctx.lineTo(x2, y2);
        ctx.stroke();

        ctx.beginPath();
        ctx.moveTo(x2, y2);
        ctx.lineTo(x2 - head * Math.cos(ang - Math.PI / 6), y2 - head * Math.sin(ang - Math.PI / 6));
        ctx.lineTo(x2 - head * Math.cos(ang + Math.PI / 6), y2 - head * Math.sin(ang + Math.PI / 6));
        ctx.closePath();
        ctx.fill();
        ctx.restore();
      }

      /**
       * 第 10 步 3D 螺旋運動繪圖模組（純手寫旋轉與透視投影，無外部依賴）
       * 座標系寫死：
       * - 原點 (0, 0, 0) = 玻璃球管球心
       * - +X 向右、+Y 向上（投影時 screenY = bulbCy - y_proj）、+Z 指向觀者（螢幕外）
       * - 磁場 B 沿 -Z 方向（正面視角指向紙面內 ⊗，與主線第 1–9 步一致）
       * - 兩圈亥姆霍茲線圈平面平行 xy 平面（法線沿 z），位於 z = ±coilHalfDist
       */
      function drawScene3D(w, h) {
        var hPhys = P.computeHelicalState({ voltageV: state.voltageV, currentA: state.currentA, deltaDeg: state.deltaDeg });
        var fontFam = getComputedStyle(document.body).fontFamily;
        var monoFam = 'ui-monospace, SFMono-Regular, Menlo, Consolas, monospace';

        // 1. 米白背景與桌面線（與主線規格一致）
        var bgGrad = ctx.createRadialGradient(w * 0.48, h * 0.38, 20, w * 0.5, h * 0.45, Math.max(w, h) * 0.75);
        bgGrad.addColorStop(0, '#FFFFFF');
        bgGrad.addColorStop(0.6, '#FAF7F1');
        bgGrad.addColorStop(1, '#F3EFE6');
        ctx.fillStyle = bgGrad;
        ctx.fillRect(0, 0, w, h);

        var bg = getBulbGeom(w, h);
        var bulbCx = bg.cx;
        var bulbCy = bg.cy;
        var bulbR = bg.r;
        var deskY = Math.min(h - 14, bulbCy + bulbR + 82);

        ctx.save();
        ctx.strokeStyle = '#DDD6C9';
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.moveTo(w * 0.03, deskY);
        ctx.lineTo(w * 0.97, deskY);
        ctx.stroke();
        ctx.restore();

        // 2. 旋轉與透視投影函數（繞 Y 軸 yaw ±60°、繞 X 軸 pitch ±35°）
        var yaw = (state.yawDeg * Math.PI) / 180;
        var pitch = (state.pitchDeg * Math.PI) / 180;
        var cosY = Math.cos(yaw), sinY = Math.sin(yaw);
        var cosP = Math.cos(pitch), sinP = Math.sin(pitch);
        var focal = bulbR * 6.5;

        function project3D(x, y, z) {
          var x1 = x * cosY + z * sinY;
          var z1 = -x * sinY + z * cosY;
          var y2 = y * cosP - z1 * sinP;
          var z2 = y * sinP + z1 * cosP;
          var scale = focal / (focal - z2);
          return {
            sx: bulbCx + x1 * scale,
            sy: bulbCy - y2 * scale,
            z2: z2,
            scale: scale
          };
        }

        // 3. 兩圈亥姆霍茲線圈（與電子圓同心、法線沿 z 軸，R_coil = 1.10 * bulbR，z = ±0.45 * bulbR）
        var coilR = bulbR * 1.10;
        var coilHalfDist = bulbR * 0.45;
        var coilSegs = 56;
        var backCoilSegs = [];
        var frontCoilSegs = [];

        [-coilHalfDist, coilHalfDist].forEach(function (cz, cIdx) {
          for (var i = 0; i < coilSegs; i++) {
            var a0 = (i / coilSegs) * Math.PI * 2 - 0.008;
            var a1 = ((i + 1) / coilSegs) * Math.PI * 2 + 0.008;
            var am = (a0 + a1) * 0.5;
            var p0 = project3D(coilR * Math.cos(a0), coilR * Math.sin(a0), cz);
            var p1 = project3D(coilR * Math.cos(a1), coilR * Math.sin(a1), cz);
            var pm = project3D(coilR * Math.cos(am), coilR * Math.sin(am), cz);
            var seg = { p0: p0, p1: p1, z2: pm.z2, isFrontCoil: cIdx === 1 };
            if (pm.z2 < 0) backCoilSegs.push(seg);
            else frontCoilSegs.push(seg);
          }
        });

        function renderCoilSegs(list) {
          list.sort(function (a, b) { return a.z2 - b.z2; });
          list.forEach(function (seg) {
            var depthRatio = Math.max(0, Math.min(1, (seg.z2 + coilR) / (2 * coilR)));
            var wPx = 9.5 * seg.p0.scale;
            ctx.save();
            ctx.lineCap = 'butt';
            // 深暗銅色邊框
            ctx.strokeStyle = '#4A2A10';
            ctx.lineWidth = wPx + 2.4;
            ctx.beginPath();
            ctx.moveTo(seg.p0.sx, seg.p0.sy);
            ctx.lineTo(seg.p1.sx, seg.p1.sy);
            ctx.stroke();

            // 銅色漸層亮度依深度調整（遠暗近亮）
            var rCol = Math.round(138 + depthRatio * 78);
            var gCol = Math.round(83 + depthRatio * 67);
            var bCol = Math.round(38 + depthRatio * 48);
            ctx.strokeStyle = 'rgb(' + rCol + ',' + gCol + ',' + bCol + ')';
            ctx.lineWidth = wPx;
            ctx.beginPath();
            ctx.moveTo(seg.p0.sx, seg.p0.sy);
            ctx.lineTo(seg.p1.sx, seg.p1.sy);
            ctx.stroke();

            // 中央細高光紋表現多匝繞線
            ctx.strokeStyle = 'rgba(255, 224, 185, ' + (0.14 + depthRatio * 0.24).toFixed(2) + ')';
            ctx.lineWidth = 1.2;
            ctx.beginPath();
            ctx.moveTo(seg.p0.sx, seg.p0.sy);
            ctx.lineTo(seg.p1.sx, seg.p1.sy);
            ctx.stroke();
            ctx.restore();
          });
        }

        // 4. 先畫後方線圈（z2 < 0）、3D 線圈支架與球管底座
        [-coilHalfDist, coilHalfDist].forEach(function (cz) {
          var legTop = project3D(0, -coilR, cz);
          var legBot = project3D(0, -(bulbR + (deskY - (bulbCy + bulbR))), cz);
          ctx.save();
          ctx.strokeStyle = '#4B5563';
          ctx.lineWidth = 8 * legTop.scale;
          ctx.beginPath();
          ctx.moveTo(legTop.sx, legTop.sy);
          ctx.lineTo(legBot.sx, Math.min(deskY, legBot.sy));
          ctx.stroke();
          ctx.fillStyle = '#1F2937';
          ctx.fillRect(legBot.sx - 12 * legBot.scale, Math.min(deskY, legBot.sy) - 5, 24 * legBot.scale, 5);
          ctx.restore();
        });
        renderCoilSegs(backCoilSegs);

        // 球管下方玻璃頸與黑色梯形底座
        ctx.save();
        var neckW = bulbR * 0.26;
        var neckTop = bulbCy + bulbR - 6;
        var baseTop = deskY - 22;
        var neckGrad = ctx.createLinearGradient(bulbCx - neckW / 2, 0, bulbCx + neckW / 2, 0);
        neckGrad.addColorStop(0, '#475569');
        neckGrad.addColorStop(0.35, '#94A3B8');
        neckGrad.addColorStop(1, '#1E293B');
        ctx.fillStyle = neckGrad;
        ctx.fillRect(bulbCx - neckW / 2, neckTop, neckW, baseTop - neckTop + 4);

        var baseGrad = ctx.createLinearGradient(bulbCx - bulbR * 0.42, baseTop, bulbCx + bulbR * 0.42, deskY);
        baseGrad.addColorStop(0, '#374151');
        baseGrad.addColorStop(0.5, '#1F2937');
        baseGrad.addColorStop(1, '#111827');
        ctx.fillStyle = baseGrad;
        ctx.beginPath();
        ctx.moveTo(bulbCx - bulbR * 0.34, baseTop);
        ctx.lineTo(bulbCx + bulbR * 0.34, baseTop);
        ctx.lineTo(bulbCx + bulbR * 0.42, deskY);
        ctx.lineTo(bulbCx - bulbR * 0.42, deskY);
        ctx.closePath();
        ctx.fill();
        ctx.restore();

        // 5. 玻璃球管背景層（半透明深藍黑，讓內部立體螺旋清晰可辨）
        ctx.save();
        var glassGrad = ctx.createRadialGradient(bulbCx - bulbR * 0.12, bulbCy - bulbR * 0.12, bulbR * 0.08, bulbCx, bulbCy, bulbR);
        glassGrad.addColorStop(0, 'rgba(11, 18, 32, 0.84)');
        glassGrad.addColorStop(0.72, 'rgba(19, 31, 51, 0.80)');
        glassGrad.addColorStop(1, 'rgba(38, 53, 77, 0.78)');
        ctx.fillStyle = glassGrad;
        ctx.beginPath();
        ctx.arc(bulbCx, bulbCy, bulbR, 0, Math.PI * 2);
        ctx.fill();

        ctx.strokeStyle = '#94A3B8';
        ctx.lineWidth = 2.4;
        ctx.beginPath();
        ctx.arc(bulbCx, bulbCy, bulbR, 0, Math.PI * 2);
        ctx.stroke();
        ctx.restore();

        // 6. 球管內 3D 電子螺旋軌跡與代表電子（δ = 0 時與主線 xy 平面正圓無縫銜接）
        var rg = getRulerGeom(w, h);
        var pxPerCm = rg.width / rg.maxCm;
        var rPx = hPhys.radiusCm * pxPerCm;
        var gunX = -bulbR * 0.88;
        var circCx = gunX + rPx;
        var deltaRad = (hPhys.deltaDeg * Math.PI) / 180;
        var tanDelta = Math.tan(deltaRad);

        // δ = 0 時在 z = 0 繞一圈正圓；δ > 0 時從球管後方內部 (-0.74*bulbR) 螺旋前進至 (+0.74*bulbR)
        var zStart = hPhys.deltaDeg > 0 ? -bulbR * 0.74 : 0;
        var zEnd = hPhys.deltaDeg > 0 ? bulbR * 0.74 : 0;
        var dzPerRad = rPx * tanDelta * 0.62;
        var maxThetaSpan = hPhys.deltaDeg > 0
          ? Math.min(Math.PI * 8, (zEnd - zStart) / Math.max(1e-4, dzPerRad))
          : Math.PI * 2;
        var helixSteps = 180;
        var helixPts = [];

        for (var k = 0; k <= helixSteps; k++) {
          var frac = k / helixSteps;
          var ang = Math.PI + frac * maxThetaSpan;
          var hx = circCx + rPx * Math.cos(ang);
          var hy = -rPx * Math.sin(ang); // +Y 向上對應螢幕向上 (-sin)
          var hz = zStart + frac * maxThetaSpan * dzPerRad;
          helixPts.push({ x: hx, y: hy, z: hz, p: project3D(hx, hy, hz) });
        }

        // 依深度由遠到近繪製螺旋線段（遠淡近亮）
        var helixSegs = [];
        for (var k = 0; k < helixSteps; k++) {
          var a = helixPts[k], b = helixPts[k + 1];
          helixSegs.push({ a: a.p, b: b.p, z2: (a.p.z2 + b.p.z2) * 0.5 });
        }
        helixSegs.sort(function (u, v) { return u.z2 - v.z2; });

        ctx.save();
        ctx.lineCap = 'round';
        helixSegs.forEach(function (seg) {
          var dNorm = Math.max(0, Math.min(1, (seg.z2 + bulbR * 0.8) / (bulbR * 1.6)));
          // 外層青綠光暈
          ctx.strokeStyle = 'rgba(16, 185, 129, ' + (0.14 + dNorm * 0.24).toFixed(2) + ')';
          ctx.lineWidth = 8.5 * seg.a.scale;
          ctx.beginPath();
          ctx.moveTo(seg.a.sx, seg.a.sy);
          ctx.lineTo(seg.b.sx, seg.b.sy);
          ctx.stroke();

          // 核心亮線
          ctx.strokeStyle = 'rgba(167, 243, 208, ' + (0.42 + dNorm * 0.58).toFixed(2) + ')';
          ctx.lineWidth = 2.4 * seg.a.scale;
          ctx.beginPath();
          ctx.moveTo(seg.a.sx, seg.a.sy);
          ctx.lineTo(seg.b.sx, seg.b.sy);
          ctx.stroke();
        });

        // 代表電子亮點與 3D 切線速度箭頭（速率大小恆定，不隨 δ 改變）
        var eAng = Math.PI + state.electronPhase * maxThetaSpan;
        var ex = circCx + rPx * Math.cos(eAng);
        var ey = -rPx * Math.sin(eAng);
        var ez = zStart + state.electronPhase * maxThetaSpan * dzPerRad;
        var ep = project3D(ex, ey, ez);

        // 3D 切線單位向量：d(x,y,z)/dθ ∝ (-sinθ, -cosθ, tanδ)，乘以 cosδ 後正好是 ( -sinθ·cosδ, -cosθ·cosδ, sinδ )，長度恆為 1！
        var tx = -Math.sin(eAng) * Math.cos(deltaRad);
        var ty = -Math.cos(eAng) * Math.cos(deltaRad);
        var tz = Math.sin(deltaRad);
        var arrowLen3D = 24 + ((hPhys.speedMs - 5.9e6) / (10.3e6 - 5.9e6)) * 30;
        var tipP = project3D(ex + tx * arrowLen3D, ey + ty * arrowLen3D, ez + tz * arrowLen3D);

        ctx.fillStyle = '#FFFFFF';
        ctx.beginPath();
        ctx.arc(ep.sx, ep.sy, 4.4 * ep.scale, 0, Math.PI * 2);
        ctx.fill();
        drawArrow(ep.sx, ep.sy, tipP.sx, tipP.sy, '#EF4444', 2.4);
        ctx.restore();

        // 7. 玻璃前景高光弧
        ctx.save();
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.22)';
        ctx.lineWidth = 4.5;
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.arc(bulbCx, bulbCy, bulbR - 11, -Math.PI * 0.85, -Math.PI * 0.42);
        ctx.stroke();
        ctx.restore();

        // 8. 前方線圈（z2 >= 0，壓在球管前方）
        renderCoilSegs(frontCoilSegs);

        // 9. 電子槍（隨 δ 傾斜，讓轉視角時看得出槍口朝 z 偏轉）
        ctx.save();
        var gunLen = 72;
        var gunTipP = project3D(gunX, 0, zStart);
        var gunTailP = project3D(gunX - gunLen * Math.cos(deltaRad), 0, zStart - gunLen * Math.sin(deltaRad));
        var gAng = Math.atan2(gunTipP.sy - gunTailP.sy, gunTipP.sx - gunTailP.sx);
        var gDist = Math.hypot(gunTipP.sx - gunTailP.sx, gunTipP.sy - gunTailP.sy);
        ctx.translate(gunTailP.sx, gunTailP.sy);
        ctx.rotate(gAng);
        var gGrad = ctx.createLinearGradient(0, -10, 0, 10);
        gGrad.addColorStop(0, '#E5E7EB');
        gGrad.addColorStop(0.5, '#94A3B8');
        gGrad.addColorStop(1, '#334155');
        ctx.fillStyle = gGrad;
        ctx.strokeStyle = '#1E293B';
        ctx.lineWidth = 1.4;
        ctx.beginPath();
        ctx.roundRect(0, -10, gDist, 20, 4);
        ctx.fill();
        ctx.stroke();
        ctx.fillStyle = '#F59E0B';
        ctx.beginPath();
        ctx.arc(12, 0, 3.8, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();

        // 10. 磁場 B 3D 方向圖例（右上角：正面為 ⊗ 指向紙內，轉動視角後顯示 3D 箭頭方向）
        ctx.save();
        var legX = w * 0.86;
        var legY = bulbCy - bulbR * 0.45;
        if (Math.abs(state.yawDeg) < 4 && Math.abs(state.pitchDeg) < 4) {
          ctx.strokeStyle = '#1D1D1F';
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.arc(legX, legY, 13, 0, Math.PI * 2);
          ctx.stroke();
          ctx.beginPath();
          ctx.moveTo(legX - 8, legY - 8);
          ctx.lineTo(legX + 8, legY + 8);
          ctx.moveTo(legX + 8, legY - 8);
          ctx.lineTo(legX - 8, legY + 8);
          ctx.stroke();
          ctx.fillStyle = '#1D1D1F';
          ctx.font = '700 12px ' + fontFam;
          ctx.textAlign = 'center';
          ctx.fillText('B 指向紙內 (-Z)', legX, legY + 26);
        } else {
          // 投影一支沿 -Z 方向的立體磁場箭頭（相對於圖例中心）
          var bOrigin = project3D(0, 0, 0);
          var bTip = project3D(0, 0, -48);
          var bDx = bTip.sx - bOrigin.sx;
          var bDy = bTip.sy - bOrigin.sy;
          drawArrow(legX - bDx * 0.4, legY - bDy * 0.4, legX + bDx * 0.6, legY + bDy * 0.6, '#2563EB', 2.6);
          ctx.fillStyle = '#1D1D1F';
          ctx.font = '700 12px ' + fontFam;
          ctx.textAlign = 'center';
          ctx.fillText('B 方向 (-Z 軸)', legX, legY + 34);
        }

        // 左下角簡易操作提示
        ctx.fillStyle = '#6E6E73';
        ctx.font = '600 12px ' + fontFam;
        ctx.textAlign = 'left';
        ctx.fillText('拖曳畫面旋轉視角（yaw ' + Math.round(state.yawDeg) + '° / pitch ' + Math.round(state.pitchDeg) + '°）', w * 0.04, deskY - 12);
        ctx.restore();
      }

      function drawScene(w, h) {
        if (state.step === 10) {
          drawScene3D(w, h);
          return;
        }
        var phys = getPhys();
        var fontFam = getComputedStyle(document.body).fontFamily;
        var monoFam = 'ui-monospace, SFMono-Regular, Menlo, Consolas, monospace';

        // 背景維持米白系，加上極淡徑向亮區襯托儀器
        var bgGrad = ctx.createRadialGradient(w * 0.48, h * 0.38, 20, w * 0.5, h * 0.45, Math.max(w, h) * 0.75);
        bgGrad.addColorStop(0, '#FFFFFF');
        bgGrad.addColorStop(0.6, '#FAF7F1');
        bgGrad.addColorStop(1, '#F3EFE6');
        ctx.fillStyle = bgGrad;
        ctx.fillRect(0, 0, w, h);

        var bg = getBulbGeom(w, h);
        var bulbCx = bg.cx;
        var bulbCy = bg.cy;
        var bulbR = bg.r;
        var deskY = h - 28;
        var rg = getRulerGeom(w, h);
        var pxPerCm = rg.width / rg.maxCm;
        var gunTipX = rg.left;
        var gunTipY = bulbCy;

        // 0. 統一桌面線與桌面接觸陰影
        ctx.save();
        ctx.strokeStyle = '#CFC8BA';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(w * 0.03, deskY);
        ctx.lineTo(w * 0.97, deskY);
        ctx.stroke();

        // 桌面下方柔和接觸陰影（球管底座＋左右電源）
        function drawContactShadow(cx, cy, rx, ry) {
          var sg = ctx.createRadialGradient(cx, cy, 2, cx, cy, rx);
          sg.addColorStop(0, 'rgba(29, 29, 31, 0.22)');
          sg.addColorStop(1, 'rgba(29, 29, 31, 0)');
          ctx.fillStyle = sg;
          ctx.beginPath();
          ctx.ellipse(cx, cy, rx, ry, 0, 0, Math.PI * 2);
          ctx.fill();
        }
        drawContactShadow(bulbCx + 6, deskY + 4, bulbR * 0.65, 9);
        drawContactShadow(w * 0.05 + 88, deskY + 4, 96, 8);
        drawContactShadow(w * 0.72 + 88, deskY + 4, 96, 8);
        ctx.restore();

        // 輔助：繪製與電子圓同心、平行的亥姆霍茲圓環線圈（正面視角）
        // 後圈在球管後方（半徑較大，僅在球管外緣露出一道銅環弧邊）；前圈在球管前方（環形帶＋繞線細紋，內側完全透空）
        var rearCoilR = bulbR * 1.13;
        var frontCoilR = bulbR * 1.05;
        function drawConcentricCoil(radius, bandW, isFront) {
          ctx.save();
          // 銅色漸層（左上受光亮 #d08a4a → 右下暗 #8a5326）
          var coilGrad = ctx.createLinearGradient(
            bulbCx - radius, bulbCy - radius,
            bulbCx + radius, bulbCy + radius
          );
          if (isFront) {
            coilGrad.addColorStop(0, '#D89656');
            coilGrad.addColorStop(0.5, '#B4692E');
            coilGrad.addColorStop(1, '#7C451C');
          } else {
            coilGrad.addColorStop(0, '#A66A36');
            coilGrad.addColorStop(0.55, '#8A5326');
            coilGrad.addColorStop(1, '#5C3414');
          }

          // 深暗銅色基底環帶
          ctx.strokeStyle = '#4A2A10';
          ctx.lineWidth = bandW + 2.5;
          ctx.beginPath();
          ctx.arc(bulbCx, bulbCy, radius, 0, Math.PI * 2);
          ctx.stroke();

          // 主銅色環帶
          ctx.strokeStyle = coilGrad;
          ctx.lineWidth = bandW;
          ctx.beginPath();
          ctx.arc(bulbCx, bulbCy, radius, 0, Math.PI * 2);
          ctx.stroke();

          // 多匝同心細圈紋（做出繞線感）
          var offsets = [-bandW * 0.34, -bandW * 0.11, bandW * 0.12, bandW * 0.34];
          offsets.forEach(function (dr, idx) {
            ctx.strokeStyle = idx % 2 === 0
              ? (isFront ? 'rgba(255, 224, 185, 0.38)' : 'rgba(235, 185, 135, 0.22)')
              : 'rgba(65, 34, 12, 0.55)';
            ctx.lineWidth = 1.1;
            ctx.beginPath();
            ctx.arc(bulbCx, bulbCy, radius + dr, 0, Math.PI * 2);
            ctx.stroke();
          });
          ctx.restore();
        }

        // 1. 先畫後方線圈（在球管後方，球管會遮住其內側，只於外緣露出一道同色銅環弧邊）
        drawConcentricCoil(rearCoilR, 10, false);

        // 2. 電子槍後方電源線（弧線連到左下角加速電源）
        var psLeftX = w * 0.05;
        var psRightX = w * 0.72;
        var psW = 172;
        var psH = 54;
        var psY = deskY - psH;

        ctx.save();
        ctx.strokeStyle = '#374151';
        ctx.lineWidth = 4;
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(gunTipX - 76, gunTipY);
        ctx.bezierCurveTo(gunTipX - 115, gunTipY + 10, psLeftX + psW * 0.45, psY - 55, psLeftX + psW * 0.5, psY);
        ctx.stroke();
        ctx.restore();

        // 3. 球管下方玻璃頸與黑色圓底座（落在桌面線上）
        ctx.save();
        var neckW = bulbR * 0.26;
        var neckTop = bulbCy + bulbR - 6;
        var baseTop = deskY - 22;
        var neckGrad = ctx.createLinearGradient(bulbCx - neckW / 2, 0, bulbCx + neckW / 2, 0);
        neckGrad.addColorStop(0, '#475569');
        neckGrad.addColorStop(0.35, '#94A3B8');
        neckGrad.addColorStop(1, '#1E293B');
        ctx.fillStyle = neckGrad;
        ctx.fillRect(bulbCx - neckW / 2, neckTop, neckW, baseTop - neckTop + 4);

        // 黑色圓柱/梯形底座
        var baseGrad = ctx.createLinearGradient(bulbCx - bulbR * 0.42, baseTop, bulbCx + bulbR * 0.42, deskY);
        baseGrad.addColorStop(0, '#374151');
        baseGrad.addColorStop(0.5, '#1F2937');
        baseGrad.addColorStop(1, '#111827');
        ctx.fillStyle = baseGrad;
        ctx.beginPath();
        ctx.moveTo(bulbCx - bulbR * 0.34, baseTop);
        ctx.lineTo(bulbCx + bulbR * 0.34, baseTop);
        ctx.lineTo(bulbCx + bulbR * 0.42, deskY);
        ctx.lineTo(bulbCx - bulbR * 0.42, deskY);
        ctx.closePath();
        ctx.fill();
        ctx.restore();

        // 4. 圓形玻璃球管（中心深藍黑向邊緣略亮＋青綠環境光＋雙層壁厚＋雙高光弧）
        ctx.save();
        var glassGrad = ctx.createRadialGradient(bulbCx - bulbR * 0.12, bulbCy - bulbR * 0.12, bulbR * 0.08, bulbCx, bulbCy, bulbR);
        glassGrad.addColorStop(0, '#0B1220');
        glassGrad.addColorStop(0.72, '#131F33');
        glassGrad.addColorStop(1, '#26354D');
        ctx.fillStyle = glassGrad;
        ctx.beginPath();
        ctx.arc(bulbCx, bulbCy, bulbR, 0, Math.PI * 2);
        ctx.fill();

        // 管內青綠色環境光暈
        var envGlow = ctx.createRadialGradient(bulbCx, bulbCy, bulbR * 0.1, bulbCx, bulbCy, bulbR * 0.88);
        envGlow.addColorStop(0, 'rgba(16, 185, 129, 0.08)');
        envGlow.addColorStop(0.6, 'rgba(16, 185, 129, 0.04)');
        envGlow.addColorStop(1, 'rgba(16, 185, 129, 0)');
        ctx.fillStyle = envGlow;
        ctx.beginPath();
        ctx.arc(bulbCx, bulbCy, bulbR - 4, 0, Math.PI * 2);
        ctx.fill();

        // 玻璃壁外圈＋內側淡色細線（雙面壁厚）
        ctx.strokeStyle = '#94A3B8';
        ctx.lineWidth = 2.6;
        ctx.beginPath();
        ctx.arc(bulbCx, bulbCy, bulbR, 0, Math.PI * 2);
        ctx.stroke();

        ctx.strokeStyle = 'rgba(226, 232, 240, 0.35)';
        ctx.lineWidth = 1.2;
        ctx.beginPath();
        ctx.arc(bulbCx, bulbCy, bulbR - 4.5, 0, Math.PI * 2);
        ctx.stroke();
        ctx.restore();

        // 5. 青綠色雙層發光電子束＋代表電子＋切線速度箭頭（裁切在球管內）
        var speedArrowLen = 22 + ((phys.speedMs - 5.9e6) / (10.3e6 - 5.9e6)) * 34;
        var elX, elY, vxDir, vyDir;

        ctx.save();
        ctx.beginPath();
        ctx.arc(bulbCx, bulbCy, bulbR - 5, 0, Math.PI * 2);
        ctx.clip();

        // 出槍口光斑
        var spotGrad = ctx.createRadialGradient(gunTipX + 2, gunTipY, 1, gunTipX + 2, gunTipY, 14);
        spotGrad.addColorStop(0, 'rgba(167, 243, 208, 0.95)');
        spotGrad.addColorStop(1, 'rgba(16, 185, 129, 0)');
        ctx.fillStyle = spotGrad;
        ctx.beginPath();
        ctx.arc(gunTipX + 2, gunTipY, 14, 0, Math.PI * 2);
        ctx.fill();

        if (!phys.isCircular) {
          var endX = bulbCx + bulbR;
          ctx.strokeStyle = 'rgba(16, 185, 129, 0.30)';
          ctx.lineWidth = 11;
          ctx.beginPath();
          ctx.moveTo(gunTipX, gunTipY);
          ctx.lineTo(endX, gunTipY);
          ctx.stroke();

          ctx.strokeStyle = '#A7F3D0';
          ctx.lineWidth = 2.8;
          ctx.beginPath();
          ctx.moveTo(gunTipX, gunTipY);
          ctx.lineTo(endX, gunTipY);
          ctx.stroke();

          elX = gunTipX + state.electronPhase * (endX - gunTipX - 18);
          elY = gunTipY;
          vxDir = 1;
          vyDir = 0;
        } else {
          var rPx = (phys.diameterCm * 0.5) * pxPerCm;
          var circCx = gunTipX + rPx;
          var circCy = gunTipY;

          ctx.strokeStyle = 'rgba(16, 185, 129, 0.30)';
          ctx.lineWidth = 11;
          ctx.beginPath();
          ctx.arc(circCx, circCy, rPx, 0, Math.PI * 2);
          ctx.stroke();

          ctx.strokeStyle = '#A7F3D0';
          ctx.lineWidth = 2.8;
          ctx.beginPath();
          ctx.arc(circCx, circCy, rPx, 0, Math.PI * 2);
          ctx.stroke();

          var theta = Math.PI + state.electronPhase * Math.PI * 2;
          elX = circCx + rPx * Math.cos(theta);
          elY = circCy + rPx * Math.sin(theta);
          vxDir = -Math.sin(theta);
          vyDir = Math.cos(theta);
        }

        ctx.fillStyle = '#FFFFFF';
        ctx.beginPath();
        ctx.arc(elX, elY, 4.5, 0, Math.PI * 2);
        ctx.fill();
        drawArrow(elX, elY, elX + vxDir * speedArrowLen, elY + vyDir * speedArrowLen, '#EF4444', 2.4);
        ctx.restore();

        // 6. 玻璃球管前景雙高光弧（左上主高光＋右下弱反射弧）
        ctx.save();
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.24)';
        ctx.lineWidth = 5;
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.arc(bulbCx, bulbCy, bulbR - 11, -Math.PI * 0.85, -Math.PI * 0.42);
        ctx.stroke();

        ctx.strokeStyle = 'rgba(255, 255, 255, 0.10)';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.arc(bulbCx, bulbCy, bulbR - 11, Math.PI * 0.12, Math.PI * 0.38);
        ctx.stroke();
        ctx.restore();

        // 7. 前方亥姆霍茲線圈（與電子圓同心平行，壓在球管前方）＋ 下方兩側固定支架 ＋ 引導標籤
        ctx.save();
        [-1, 1].forEach(function (side) {
          var sx = bulbCx + side * frontCoilR * 0.68;
          var syTop = bulbCy + frontCoilR * 0.73;
          var legGrad = ctx.createLinearGradient(sx - 6, syTop, sx + 6, syTop);
          legGrad.addColorStop(0, '#6B7280');
          legGrad.addColorStop(1, '#374151');
          ctx.fillStyle = legGrad;
          ctx.fillRect(sx - 5, syTop, 10, deskY - syTop);
          // 底座腳墊
          ctx.fillStyle = '#1F2937';
          ctx.fillRect(sx - 13, deskY - 6, 26, 6);
          // 環帶夾具與螺栓圓點
          ctx.fillStyle = '#4B5563';
          ctx.fillRect(sx - 7, syTop - 4, 14, 10);
          ctx.fillStyle = '#D1D5DB';
          ctx.beginPath();
          ctx.arc(sx, syTop + 1, 2.8, 0, Math.PI * 2);
          ctx.fill();
          ctx.strokeStyle = '#1F2937';
          ctx.lineWidth = 1;
          ctx.stroke();
        });
        ctx.restore();

        drawConcentricCoil(frontCoilR, 11, true);

        // 標籤「亥姆霍茲線圈」與引導線（指向前方環帶）
        ctx.save();
        var labelY = bulbCy - rearCoilR - 18;
        var targetX = bulbCx + frontCoilR * 0.34;
        var targetY = bulbCy - frontCoilR * 0.94;
        ctx.strokeStyle = '#6B7280';
        ctx.lineWidth = 1.3;
        ctx.beginPath();
        ctx.moveTo(bulbCx + 18, labelY + 4);
        ctx.lineTo(targetX, targetY);
        ctx.stroke();
        ctx.fillStyle = '#B4692E';
        ctx.beginPath();
        ctx.arc(targetX, targetY, 3.2, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = '#FFFFFF';
        ctx.lineWidth = 1;
        ctx.stroke();

        ctx.fillStyle = '#1D1D1F';
        ctx.font = '700 12px ' + fontFam;
        ctx.textAlign = 'center';
        ctx.fillText('亥姆霍茲線圈（N = 130, R = 0.15 m）', bulbCx, labelY);
        ctx.restore();

        // 8. 左側電子槍（上亮下暗拉絲金屬＋兩道環形溝槽線＋出光口小圓環）
        ctx.save();
        var gGrad = ctx.createLinearGradient(gunTipX - 78, gunTipY - 12, gunTipX - 78, gunTipY + 12);
        gGrad.addColorStop(0, '#E5E7EB');
        gGrad.addColorStop(0.35, '#CBD5E1');
        gGrad.addColorStop(0.75, '#64748B');
        gGrad.addColorStop(1, '#334155');
        ctx.fillStyle = gGrad;
        ctx.strokeStyle = '#1E293B';
        ctx.lineWidth = 1.4;
        ctx.beginPath();
        ctx.roundRect(gunTipX - 78, gunTipY - 11, 78, 22, 4);
        ctx.fill();
        ctx.stroke();

        // 兩道環形溝槽線
        ctx.strokeStyle = '#334155';
        ctx.lineWidth = 1.5;
        [-48, -24].forEach(function (dx) {
          ctx.beginPath();
          ctx.moveTo(gunTipX + dx, gunTipY - 11);
          ctx.lineTo(gunTipX + dx, gunTipY + 11);
          ctx.stroke();
        });

        // 前端出光口小圓環
        ctx.fillStyle = '#1E293B';
        ctx.strokeStyle = '#94A3B8';
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.ellipse(gunTipX - 1, gunTipY, 3.5, 8, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();

        // 發光燈絲端
        ctx.fillStyle = '#F59E0B';
        ctx.beginPath();
        ctx.arc(gunTipX - 66, gunTipY, 4, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = '#1D1D1F';
        ctx.font = '700 12px ' + fontFam;
        ctx.textAlign = 'center';
        ctx.fillText('電子槍', gunTipX - 56, gunTipY - 20);
        ctx.restore();

        // 9. 右上角磁場方向標記 ⊗ B
        ctx.save();
        var bx = w * 0.89;
        var by = h * 0.14;
        ctx.strokeStyle = '#1D1D1F';
        ctx.lineWidth = 1.8;
        ctx.beginPath();
        ctx.arc(bx, by, 11, 0, Math.PI * 2);
        ctx.stroke();
        if (phys.isCircular) {
          ctx.beginPath();
          ctx.moveTo(bx - 6, by - 6); ctx.lineTo(bx + 6, by + 6);
          ctx.moveTo(bx + 6, by - 6); ctx.lineTo(bx - 6, by + 6);
          ctx.stroke();
        }
        ctx.fillStyle = '#1D1D1F';
        ctx.font = '700 12px ' + fontFam;
        ctx.textAlign = 'center';
        ctx.fillText(phys.isCircular ? 'B 指向紙內' : 'B = 0', bx, by + 24);
        ctx.restore();

        // 10. 刻度尺（加立架與刻痕陰影，真尺站在管後）
        ctx.save();
        ctx.fillStyle = '#6B7280';
        ctx.fillRect(rg.left - 4, rg.y + 22, 6, 8);
        ctx.fillRect(rg.right - 2, rg.y + 22, 6, 8);

        ctx.shadowColor = 'rgba(0,0,0,0.12)';
        ctx.shadowBlur = 4;
        ctx.shadowOffsetY = 2;
        ctx.fillStyle = '#EFECE4';
        ctx.strokeStyle = '#9CA3AF';
        ctx.lineWidth = 1.2;
        ctx.fillRect(rg.left - 8, rg.y, rg.width + 16, 22);
        ctx.shadowBlur = 0;
        ctx.shadowOffsetY = 0;
        ctx.strokeRect(rg.left - 8, rg.y, rg.width + 16, 22);

        ctx.fillStyle = '#1D1D1F';
        ctx.font = '600 10px ' + monoFam;
        ctx.textAlign = 'center';
        for (var cm = 0; cm <= rg.maxCm; cm += 1) {
          var tx = rg.left + (cm / rg.maxCm) * rg.width;
          var tickH = cm % 2 === 0 ? 9 : 5;
          ctx.beginPath();
          ctx.moveTo(tx, rg.y);
          ctx.lineTo(tx, rg.y + tickH);
          ctx.stroke();
          if (cm % 2 === 0) {
            ctx.fillText(String(cm), tx, rg.y + 19);
          }
        }
        ctx.fillText('cm', rg.right + 18, rg.y + 15);
        ctx.restore();

        // 11. 兩台寫實電源供應器（站在桌面線上，淺金屬灰漸層、刻度旋鈕、發光 LED 數位窗）
        function drawPowerSupply(px, py, title, valStr, normAngle) {
          ctx.save();
          var panelGrad = ctx.createLinearGradient(px, py, px + psW, py + psH);
          panelGrad.addColorStop(0, '#F1F5F9');
          panelGrad.addColorStop(0.5, '#E2E8F0');
          panelGrad.addColorStop(1, '#CBD5E1');
          ctx.fillStyle = panelGrad;
          ctx.strokeStyle = '#64748B';
          ctx.lineWidth = 1.5;
          ctx.beginPath();
          ctx.roundRect(px, py, psW, psH, 7);
          ctx.fill();
          ctx.stroke();

          // 旋鈕周圍刻度環＋立體圓鈕＋指示刻線
          var kx = px + 28;
          var ky = py + psH / 2;
          ctx.strokeStyle = '#64748B';
          ctx.lineWidth = 1.2;
          for (var a = -Math.PI * 0.8; a <= Math.PI * 0.8 + 0.01; a += Math.PI * 0.4) {
            ctx.beginPath();
            ctx.moveTo(kx + Math.cos(a - Math.PI / 2) * 15, ky + Math.sin(a - Math.PI / 2) * 15);
            ctx.lineTo(kx + Math.cos(a - Math.PI / 2) * 18, ky + Math.sin(a - Math.PI / 2) * 18);
            ctx.stroke();
          }
          var knobGrad = ctx.createLinearGradient(kx - 12, ky - 12, kx + 12, ky + 12);
          knobGrad.addColorStop(0, '#475569');
          knobGrad.addColorStop(1, '#1E293B');
          ctx.fillStyle = knobGrad;
          ctx.beginPath();
          ctx.arc(kx, ky, 12, 0, Math.PI * 2);
          ctx.fill();

          var ang = -Math.PI * 0.8 + normAngle * Math.PI * 1.6 - Math.PI / 2;
          ctx.strokeStyle = '#FFFFFF';
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.moveTo(kx, ky);
          ctx.lineTo(kx + Math.cos(ang) * 10, ky + Math.sin(ang) * 10);
          ctx.stroke();

          // 深色凹陷數位讀數窗 + 綠色 LED 發光數字
          ctx.fillStyle = '#0B111E';
          ctx.strokeStyle = '#334155';
          ctx.lineWidth = 1;
          ctx.beginPath();
          ctx.roundRect(px + 54, py + 8, 108, 38, 5);
          ctx.fill();
          ctx.stroke();

          ctx.fillStyle = '#94A3B8';
          ctx.font = '600 9px ' + fontFam;
          ctx.textAlign = 'left';
          ctx.fillText(title, px + 61, py + 19);

          ctx.shadowColor = 'rgba(52, 211, 153, 0.65)';
          ctx.shadowBlur = 6;
          ctx.fillStyle = '#34D399';
          ctx.font = '700 15px ' + monoFam;
          ctx.fillText(valStr, px + 61, py + 38);
          ctx.restore();
        }

        drawPowerSupply(psLeftX, psY, '加速電源', Math.round(phys.voltageV) + ' V', (phys.voltageV - 100) / 200);
        drawPowerSupply(psRightX, psY, '線圈電源', phys.currentA.toFixed(2) + ' A', phys.currentA / 2.0);

        // 12. 第 6 步可拖曳游標與 D 雙箭頭（永遠在最上層，不被光束光暈蓋住）
        if (state.step === 6) {
          var xL = rg.left + (state.caliperLeftCm / rg.maxCm) * rg.width;
          var xR = rg.left + (state.caliperRightCm / rg.maxCm) * rg.width;
          var topY = bulbCy - bulbR * 0.72;

          ctx.save();
          [xL, xR].forEach(function (cx, idx) {
            ctx.strokeStyle = '#D93829';
            ctx.lineWidth = 1.8;
            ctx.beginPath();
            ctx.moveTo(cx, topY);
            ctx.lineTo(cx, rg.y);
            ctx.stroke();

            ctx.fillStyle = '#D93829';
            ctx.beginPath();
            ctx.moveTo(cx, topY);
            ctx.lineTo(cx - 7, topY - 12);
            ctx.lineTo(cx + 7, topY - 12);
            ctx.closePath();
            ctx.fill();

            ctx.font = '700 11px ' + monoFam;
            ctx.textAlign = 'center';
            ctx.fillText((idx === 0 ? state.caliperLeftCm : state.caliperRightCm).toFixed(1), cx, topY - 16);
          });

          var arrowY = rg.y - 12;
          ctx.strokeStyle = '#1D1D1F';
          ctx.lineWidth = 1.8;
          ctx.beginPath();
          ctx.moveTo(xL, arrowY);
          ctx.lineTo(xR, arrowY);
          ctx.stroke();

          var dLabel = 'D = ' + getMeasuredDiameterCm().toFixed(1) + ' cm';
          ctx.font = '700 12px ' + monoFam;
          var tw = ctx.measureText(dLabel).width;
          var pw = tw + 14;
          var ph = 22;
          var px = (xL + xR) / 2 - pw / 2;
          var py = arrowY - ph - 4;
          ctx.fillStyle = 'rgba(24, 24, 27, 0.86)';
          ctx.beginPath();
          ctx.roundRect(px, py, pw, ph, 6);
          ctx.fill();
          ctx.fillStyle = '#FFFFFF';
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillText(dLabel, (xL + xR) / 2, py + ph / 2 + 0.5);
          ctx.restore();
        }
      }

      var lastTime = performance.now();
      function loop(now) {
        var rawDt = Math.min(0.05, (now - lastTime) / 1000);
        lastTime = now;
        if (state.isPlaying) {
          state.electronPhase = (state.electronPhase + rawDt * 0.65 * state.speedMultiplier) % 1;
        }
        var rect = canvasWrap.getBoundingClientRect();
        var dpr = window.devicePixelRatio || 1;
        if (canvas.width !== Math.max(1, Math.floor(rect.width * dpr)) ||
            canvas.height !== Math.max(1, Math.floor(rect.height * dpr))) {
          resizeCanvas();
        }
        drawScene(rect.width, rect.height);
        requestAnimationFrame(loop);
      }

      resizeCanvas();
      renderAll();
      requestAnimationFrame(loop);
    })();
  </script>
</body>
</html>
