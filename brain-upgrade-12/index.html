<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>大腦升級戰 · 思維防身 12 關</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --paper:#F5F1E8; --card:#FFFFFF; --ink:#1D1D1F; --sub:#6E6E73; --line:#E7E1D3;
  --blue:#007AFF; --blue-d:#0062CC; --green:#248A3D; --green-bg:#EEF7F0;
  --red:#D70015; --red-bg:#FDF0F0; --radius:18px;
}
body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  background:var(--paper);color:var(--ink);min-height:100vh;display:flex;justify-content:center}
#app{width:100%;max-width:680px;min-height:100vh;display:flex;flex-direction:column;position:relative}
.screen{display:none;flex-direction:column;flex:1;padding:28px 22px 32px;animation:fadeUp .3s ease}
.screen.on{display:flex}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.eyebrow{font-size:13px;color:var(--sub);letter-spacing:.12em;text-align:center;margin-top:34px}
h1.title{font-size:38px;font-weight:800;text-align:center;margin:10px 0 6px;letter-spacing:.02em}
.subtitle{text-align:center;color:var(--sub);font-size:16px;line-height:1.7}
.card{background:var(--card);border-radius:var(--radius);padding:22px;box-shadow:0 2px 12px rgba(60,50,30,.06);margin:22px 0}
.rule{display:flex;gap:12px;padding:11px 0;border-bottom:1px solid var(--line);font-size:15.5px;line-height:1.75}
.rule:last-child{border-bottom:none}
.rule .n{flex:0 0 24px;height:24px;border-radius:50%;background:var(--ink);color:#fff;font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center;margin-top:3px}
.btn{display:block;width:100%;border:none;border-radius:14px;padding:16px;font-size:17px;font-weight:700;cursor:pointer;margin-top:12px;transition:transform .1s, background .15s;font-family:inherit}
.btn:active{transform:scale(.985)}
.btn-blue{background:var(--blue);color:#fff}
.btn-blue:active{background:var(--blue-d)}
.btn-plain{background:transparent;color:var(--blue);font-weight:600}
.footnote{text-align:center;color:var(--sub);font-size:12.5px;line-height:1.8;margin-top:auto;padding-top:24px}
/* quiz */
.qhead{margin-bottom:4px}
.qmeta{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:10px}
.qmeta .lv{font-size:14px;font-weight:700}
.qmeta .score{font-size:14px;color:var(--sub);font-variant-numeric:tabular-nums}
.pbar{height:6px;background:#E4DECF;border-radius:99px;overflow:hidden;margin-bottom:18px}
.pbar i{display:block;height:100%;background:var(--ink);border-radius:99px;transition:width .3s ease}
.streakline{font-size:13px;color:var(--sub);margin-bottom:10px;min-height:18px}
.qcard{background:var(--card);border-radius:var(--radius);padding:24px 22px;box-shadow:0 2px 12px rgba(60,50,30,.06)}
.qtag{font-size:13px;color:var(--sub);margin-bottom:10px;letter-spacing:.04em}
.qtag b{color:var(--ink)}
.qstem{font-size:17px;line-height:1.9}
.opts{display:flex;flex-direction:column;gap:10px;margin-top:18px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;background:var(--card);border:1.5px solid var(--line);
  border-radius:14px;padding:14px 16px;font-size:15.5px;line-height:1.75;cursor:pointer;color:var(--ink);width:100%;font-family:inherit;transition:border-color .15s, background .15s}
.opt .k{flex:0 0 26px;height:26px;border-radius:50%;border:1.5px solid var(--line);color:var(--sub);font-weight:700;font-size:13.5px;display:flex;align-items:center;justify-content:center;margin-top:2px;background:#fff}
.opt.right{border-color:var(--green);background:var(--green-bg)}
.opt.right .k{background:var(--green);border-color:var(--green);color:#fff}
.opt.wrong{border-color:var(--red);background:var(--red-bg)}
.opt.wrong .k{background:var(--red);border-color:var(--red);color:#fff}
.opt.dim{opacity:.5}
.opt:disabled{cursor:default}
.fb{margin-top:16px;border-radius:14px;padding:18px;font-size:15px;line-height:1.9;display:none;border:1.5px solid var(--line)}
.fb.on{display:block;animation:fadeUp .25s ease}
.fb.good{border-color:var(--green);background:var(--green-bg)}
.fb.miss{border-color:var(--red);background:var(--red-bg)}
.fb .verdict{font-weight:800;font-size:16px;margin-bottom:8px}
.fb.good .verdict{color:var(--green)} .fb.miss .verdict{color:var(--red)}
.fb h4{font-size:13px;color:var(--sub);letter-spacing:.08em;margin:12px 0 4px;font-weight:700}
.fb .src{font-size:13px;color:var(--sub);margin-top:10px}
/* splash / clear */
.center{text-align:center;padding:56px 8px}
.bignum{font-size:15px;font-weight:800;letter-spacing:.2em;color:var(--sub)}
.center h2{font-size:32px;font-weight:800;margin:12px 0 8px}
.center p{color:var(--sub);font-size:15.5px;line-height:1.8;margin-bottom:30px}
/* final */
.fcard{background:var(--card);border-radius:var(--radius);padding:30px 24px;text-align:center;box-shadow:0 2px 12px rgba(60,50,30,.06);margin-top:8px}
.fcard .rank{font-size:30px;font-weight:800;margin:6px 0 4px}
.fcard .rdesc{color:var(--sub);font-size:15px;line-height:1.8}
.stat-row{display:flex;gap:10px;margin:20px 0 6px}
.stat{flex:1;background:var(--paper);border-radius:12px;padding:14px 6px}
.stat .v{font-size:26px;font-weight:800;font-variant-numeric:tabular-nums}
.stat .l{font-size:12px;color:var(--sub);margin-top:4px}
.review{text-align:left;background:#FFFDF6;border:1.5px solid var(--line);border-radius:14px;padding:16px 18px;font-size:14.5px;line-height:1.9;margin:14px 0 4px}
.review b{font-weight:800}
.soundbtn{position:absolute;top:16px;right:16px;background:transparent;border:1px solid var(--line);color:var(--sub);
  border-radius:99px;padding:6px 14px;font-size:13px;cursor:pointer;font-family:inherit;background:#ffffff88}
.hero{display:flex;gap:18px;align-items:center;margin-top:30px}
.cover{width:128px;flex:0 0 auto;border-radius:6px;box-shadow:0 12px 30px rgba(60,50,30,.25)}
.hero-t{flex:1;min-width:0}
.hero-t .eyebrow{text-align:left;margin-top:0}
.hero-t h1.title{text-align:left;font-size:34px}
.hero-t .subtitle{text-align:left;font-size:15px}
@media (max-width:380px){.cover{width:106px}.hero-t h1.title{font-size:29px}}
</style>
</head>

<script>


let S = null;
let soundOn = true;

function show(id){
  document.querySelectorAll('.screen').forEach(e=>e.classList.remove('on'));
  document.getElementById(id).classList.add('on');
  window.scrollTo(0,0);
}
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }
function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function toggleSound(){ soundOn=!soundOn; document.getElementById('soundBtn').textContent = soundOn?"音效開":"音效關"; }
function beep(f,d,type){
  if(!soundOn) return;
  try{
    const c = beep.ctx || (beep.ctx = new (window.AudioContext||window.webkitAudioContext)());
    const o=c.createOscillator(), g=c.createGain();
    o.type=type||"sine"; o.frequency.value=f; g.gain.value=0.08;
    o.connect(g); g.connect(c.destination);
    o.start(); g.gain.exponentialRampToValueAtTime(0.001, c.currentTime+d);
    o.stop(c.currentTime+d);
  }catch(e){}
}
const sGood=()=>{beep(660,.12);setTimeout(()=>beep(880,.18),110);};
const sBad=()=>{beep(220,.22,"sine");};

function startGame(){
  S = { lv:0, qi:0, score:0, streak:0, best:0, wrong:{}, correct:0, total:0,
        order: LEVELS.map(L=>shuffle(L.qs).slice(0,3)) };
  showSplash();
}
function showSplash(){
  const L = LEVELS[S.lv];
  document.getElementById('spN').textContent = String(S.lv+1).padStart(2,"0")+" / 12";
  document.getElementById('spT').textContent = L.short;
  document.getElementById('spS').textContent = L.sub;
  show('s-splash');
}
function beginLevel(){ S.qi=0; renderQ(); }

function renderQ(){
  const L = LEVELS[S.lv], q = S.order[S.lv][S.qi];
  const done = S.lv*3 + S.qi;
  document.getElementById('qLv').textContent = "第 "+(S.lv+1)+" 關 · "+L.short;
  document.getElementById('qProg').textContent = (S.qi+1)+" / 3";
  document.getElementById('qScore').textContent = S.score;
  document.getElementById('qBar').style.width = (done/36*100)+"%";
  document.getElementById('qStreak').textContent = S.streak>=2 ? "連對 "+S.streak+" 題" : "";
  document.getElementById('qTag').textContent = q.t;
  document.getElementById('qStem').textContent = q.s;
  const box = document.getElementById('qOpts'); box.innerHTML="";
  const keys=["A","B","C","D"];
  q.o.forEach((t,i)=>{
    const b=document.createElement('button');
    b.className="opt"; b.innerHTML='<span class="k">'+keys[i]+'</span><span>'+esc(t)+'</span>';
    b.onclick=()=>answer(i,b);
    box.appendChild(b);
  });
  const fb=document.getElementById('qFb'); fb.className="fb"; fb.innerHTML="";
  const nx=document.getElementById('qNext'); nx.style.display="none";
  nx.textContent = (S.qi===2) ? "結算本關" : "下一題";
  show('s-quiz');
}

function answer(i,btn){
  const L = LEVELS[S.lv], q = S.order[S.lv][S.qi];
  const opts=[...document.getElementById('qOpts').children];
  opts.forEach(b=>b.disabled=true);
  S.total++;
  const fb=document.getElementById('qFb');
  const keys=["A","B","C","D"];
  if(i===q.a){
    S.correct++; S.streak++; S.best=Math.max(S.best,S.streak);
    let pts=10; if(S.streak>=3) pts+=5;
    S.score+=pts;
    btn.classList.add('right');
    opts.forEach((b,j)=>{ if(j!==i) b.classList.add('dim'); });
    fb.className="fb on good";
    fb.innerHTML='<div class="verdict">答對了，+'+pts+' 分</div>'
      +'<h4>思維盲點解析</h4>'+esc(q.b)
      +'<div class="src">出處：第 '+(S.lv+1)+' 課 · '+esc(L.short)+'</div>';
    sGood();
  }else{
    S.streak=0;
    S.wrong[S.lv]=(S.wrong[S.lv]||0)+1;
    btn.classList.add('wrong');
    opts[q.a].classList.add('right');
    opts.forEach((b,j)=>{ if(j!==i&&j!==q.a) b.classList.add('dim'); });
    fb.className="fb on miss";
    fb.innerHTML='<div class="verdict">答錯了，正解是 '+keys[q.a]+'</div>'
      +'<h4>思維盲點解析</h4>'+esc(q.b)
      +'<h4>拆招方法</h4>'+esc(q.p)
      +'<div class="src">出處：第 '+(S.lv+1)+' 課 · '+esc(L.short)+'</div>';
    sBad();
  }
  document.getElementById('qScore').textContent = S.score;
  document.getElementById('qBar').style.width = ((S.lv*3+S.qi+1)/36*100)+"%";
  document.getElementById('qNext').style.display="block";
}

function nextQ(){
  if(S.qi<2){ S.qi++; renderQ(); }
  else{
    const L=LEVELS[S.lv];
    document.getElementById('clN').textContent="第 "+(S.lv+1)+" 關完成 · "+L.short;
    document.getElementById('clS').textContent=S.score+" 分";
    document.getElementById('clD').textContent = S.wrong[S.lv] ? "這關錯了 "+S.wrong[S.lv]+" 題，解析看完再走。" : "完美過關，這一課的陷阱對你沒用。";
    document.getElementById('clBtn').textContent = (S.lv===11) ? "看最終結果" : "下一關";
    show('s-clear');
  }
}
function nextLevel(){
  if(S.lv<11){ S.lv++; showSplash(); }
  else showFinal();
}
function rankFor(s){
  if(s>=320) return ["思維駭客","陷阱看到你都自動繞路。大腦作業系統 v12.0，升級完成。"];
  if(s>=250) return ["邏輯守衛","十二種武器大致上手，校園生存穩了。"];
  if(s>=160) return ["防身學徒","招式有了，連招還要練。下面標的那幾課值得回去複習。"];
  if(s>=80)  return ["清醒新手","至少你開始懷疑自己的大腦了，這就是升級的第一步。"];
  return ["原廠設定","你的大腦還在用出廠預設值。建議從第 1 課開始。"];
}
function showFinal(){
  const [r,d]=rankFor(S.score);
  document.getElementById('fRank').textContent=r;
  document.getElementById('fDesc').textContent=d;
  document.getElementById('fScore').textContent=S.score;
  document.getElementById('fAcc').textContent=Math.round(S.correct/S.total*100)+"%";
  document.getElementById('fBest').textContent=S.best;
  const bad=Object.entries(S.wrong).sort((a,b)=>b[1]-a[1]).slice(0,2);
  const rv=document.getElementById('fReview');
  if(bad.length){
    rv.style.display="block";
    rv.innerHTML="<b>建議回看</b><br>"+bad.map(([lv,n])=>"第 "+(+lv+1)+" 課 · "+esc(LEVELS[lv].short)+"（錯 "+n+" 題）").join("<br>");
  } else rv.style.display="none";
  show('s-final');
}
</script>
